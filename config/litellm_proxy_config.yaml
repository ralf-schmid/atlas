# Config fuer den LiteLLM-Proxy-Prozess selbst (nicht zu verwechseln mit config/llm.yaml,
# das unser eigenes Rollen-Routing beschreibt). Format: https://docs.litellm.ai/docs/proxy/configs
# Keys kommen ausschliesslich aus Environment-Variablen (Invariante 6).

model_list:
  # Kanonisch: die Namen, auf die config/llm.yaml zeigt. Seit 31.07.2026 auf
  # OpenCode Zen statt Anthropic direkt (F094/ADR-0011) — Anthropic-Guthaben war
  # erschoepft. Rollback: diesen Block und den -anthropic-Block unten tauschen,
  # dann `docker compose restart litellm` (Bind-Mount, kein Image-Rebuild).
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_base: https://opencode.ai/zen
      api_key: os.environ/OPENCODE_API_KEY
    model_info:
      input_cost_per_token: 0.000002    # $2.00 / 1M
      output_cost_per_token: 0.00001    # $10.00 / 1M
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_base: https://opencode.ai/zen
      api_key: os.environ/OPENCODE_API_KEY
    model_info:
      input_cost_per_token: 0.000001    # $1.00 / 1M
      output_cost_per_token: 0.000005   # $5.00 / 1M

  # Rueckfallweg: Anthropic direkt. Bleibt dauerhaft konfiguriert, damit ein
  # Zen-Ausfall (Gateway, Cloudflare) ein Namenstausch statt einer Recherche ist.
  - model_name: claude-sonnet-5-anthropic
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5-anthropic
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # Experiment-Slot, bewusst NICHT produktiv geschaltet: keine Rolle in
  # config/llm.yaml zeigt hierauf. Gedacht fuer den P7-A/B-Test mit GUARDIAN
  # (CLAUDE.md Entscheidungsstand Punkt 7). Umstellen waere eine bewusste
  # Entscheidung mit ADR, kein Config-Nebeneffekt.
  #
  # "big-pickle" ist ein Deckname: die API antwortet mit model=deepseek-v4-flash.
  # Zwei Gruende, das nicht in persona_analysis zu haengen:
  #   1. Reasoning-Modell ohne abschaltbares Thinking. F073s Gegenmittel
  #      (thinking={"type":"disabled"}) ist Anthropic-spezifisch und wirkt hier
  #      nicht — dasselbe Muster (leerer content bei verbrauchtem Token-Budget)
  #      ist live reproduzierbar, sobald max_tokens knapp wird.
  #   2. Anderer Modellfamilie als Sonnet: mitten im 8-Wochen-Wettbewerb waere
  #      das ein Bruch des Vergleichs, nicht nur ein Provider-Wechsel.
  #
  # openai/-Praefix + api_base MIT /v1: dieses Modell laeuft ueber Zens
  # OpenAI-kompatiblen /chat/completions-Pfad, nicht ueber /messages wie die
  # Claude-Modelle oben. Beide Auth-Formate funktionieren, LiteLLM nutzt Bearer.
  - model_name: big-pickle
    litellm_params:
      model: openai/big-pickle
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_API_KEY
    model_info:
      # Stand 31.07.2026 kostenlos ("free for a limited time"), Zen liefert keine
      # Kosten-Header. Endet die Gratisphase, bucht cost_ledger lautlos 0.00 —
      # vor produktiver Nutzung zwingend gegen die dann gueltige Preisliste pruefen.
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

# Zen-Routing-Details, live verifiziert (F094 §3.2), damit sie beim naechsten
# Anfassen nicht neu erarbeitet werden muessen:
#   * api_base OHNE /v1 — LiteLLM haengt "/v1/messages" selbst an
#     (litellm/main.py:2605); mit /v1 wuerde /v1/v1/messages daraus.
#   * Auth ist x-api-key (Anthropic-nativ), nicht Bearer —
#     use_bearer_for_custom_base bleibt aus.
#   * Modell-IDs mit Bindestrich. Die Web-Doku zeigt "claude-haiku-4.5" mit
#     Punkt, das lehnt die API ab; GET /zen/v1/models ist die belastbare Quelle.
#   * model_info-Preise sind tragend, nicht kosmetisch: sonst rechnet LiteLLM mit
#     Anthropics Preistabelle und schreibt ueber x-litellm-response-cost falsche
#     Kosten ins cost_ledger — Ebene 2 der Kostenbremse (Invariante 7), laut
#     ADR-0010 die einzige aktive. Stand 31.07.2026, Zen-Listenpreis.
#     Cache-Multiplikatoren (1.25x Write, 0.1x Read) wendet LiteLLM selbst an.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
