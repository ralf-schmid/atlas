# LiteLLM-Routing + Kosten-Caps, ARCHITECTURE.md §3.3/§5.1/§6.3.
# Getrennte LiteLLM-Keys je Agent-Rolle x Persona werden im LiteLLM-Proxy selbst verwaltet
# (virtuelle Keys, nicht hier) - diese Datei beschreibt nur Routing + die Orchestrator-
# seitigen Caps (Ebene 2 der doppelten Kosten-Bremse, Invariante 7).

base_url: http://localhost:4000

caps:
  # Raised 5.0 -> 10.0 (Ralf, 25.07.2026): headroom for the P5 Review-Agent (Sonnet)
  # plus the Sonnet-5 intro-price expiry on 31.08.2026 (+50% on Sonnet cost). See ADR-0008.
  system_daily_usd: 10.0
  # Per-persona cap unchanged: current spend ~0.4-0.5 USD/persona/day, and the raise
  # targets shared/system cost (Review-Agent runs as a shared role), not persona_analysis.
  persona_daily_usd: 1.0
  # Raised 120 -> 240 in step with the daily cap (keeps the ~24-days-of-full-spend ratio),
  # so the monthly soft cap doesn't silently become the binding limit after 12 days.
  monthly_soft_cap_usd: 240.0
  monthly_soft_cap_warn_pct: 0.8

roles:
  market_research:
    model: claude-haiku-4-5
    provider: anthropic
    shared: true
    prompt_caching: true
  # Haiku fuer Recherche (CLAUDE.md); Groq bleibt Experiment-Slot fuer P7 (GUARDIAN-A/B).
  # provider muss zum Proxy-Routing passen: claude-haiku-4-5 -> anthropic; der Groq-Slot
  # heisst im Proxy claude-haiku-4-5-groq (config/litellm_proxy_config.yaml).
  news_research:
    model: claude-haiku-4-5
    provider: anthropic
    shared: true
    prompt_caching: true
  persona_analysis:
    model: claude-sonnet-5
    provider: anthropic
    shared: false
    prompt_caching: true
  trading:
    model: claude-haiku-4-5
    provider: anthropic
    shared: false
    prompt_caching: false
  review:
    model: claude-sonnet-5
    provider: anthropic
    shared: true
    prompt_caching: true
