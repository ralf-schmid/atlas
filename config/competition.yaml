# Competition parameters — consumed by the SPY benchmark (F081) and the
# official competition start/reset (F090). See docs/dod/phase-5.md.
#
# start_date originally 2026-08-03 (Ralf, 2026-07-25). Pulled forward to Monday
# 2026-07-27 on 2026-07-26 (Ralf): the 3 native Alpaca accounts were recreated at
# 5000 now (F090/ADR-0009), so the competition starts on the first trading day
# after the reset instead of idling the fresh accounts for a week. 8 weeks -> ends
# Friday 2026-09-18. Safe edit: no benchmark snapshot exists yet (the benchmark
# activates on start_date, still in the future at edit time). Changing it AFTER the
# first benchmark snapshot needs a documented recomputation — never silent (F081 §2).
competition:
  start_date: 2026-07-27
  start_capital_usd: 5000
  # F121: last day of the 8-week competition (start_date + 8 weeks - 1 trading week
  # day). Drives the closing valuation (`src/orchestrator/competition_settlement.py`)
  # and the final §4.7 report. Ralf's ruling (16.08.2026, docs/dod/phase-5.md): open
  # positions are valued at this day's closing price, not force-liquidated. The paper
  # field keeps running afterwards (ARCHITECTURE.md §4.7) — this date only closes the
  # scoring window, it stops nothing.
  end_date: 2026-09-18

benchmark:
  enabled: true
  symbol: SPY
