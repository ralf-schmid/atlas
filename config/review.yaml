# Slippage malus parameters — see docs/features/F083-slippage-malus-berechnung.md.
# Defaults proposed at F083 implementation (2026-07-25, Ralf-approved approach).
# Fine-tuned before 2026-08-03 competition start — each change documented.
slippage:
  enabled: true

  # F104: use the spread measured at order time (order_record.spread_bps) when it
  # is present; false falls every order back to the flat rates below (rollback path,
  # no deploy needed — the column keeps being filled either way).
  use_measured_spread: true

  # F104: upper plausibility bound for a measured spread. A crossed or extremely
  # wide quote (thin trading, halt, auction) would otherwise land straight in the
  # leaderboard's adjusted performance; beyond this, the flat rate applies.
  max_measured_bps: 500

  # Spread in basis points (1 bps = 0.01 % = 0.0001).
  # Asset-class defaults — equities liquid, crypto wider. Since F104 these are the
  # fallback for orders without a usable measurement (everything before 2026-08-11).
  spread_bps:
    equities: 5
    crypto: 15

  # F116: die Klassifikation Krypto/Aktie haengt seit 15.08.2026 nicht mehr an
  # dieser Liste, sondern am Paar-Format `BASE/QUOTE` (src/review/slippage.py,
  # `_asset_class`). Die Liste war zweimal die Fehlerquelle: sie ging nach
  # ADR-0016 still veraltet (AVAX/AAVE/UNI/LINK bekamen den Aktien-Spread), und
  # kurze Fragmente wie "UNI" oder "LINK" haetten jeden Aktien-Ticker treffen
  # koennen, der sie enthaelt. Bewusst ersatzlos entfernt statt gepflegt.

  # F114: Anteil des echten Marktvolumens, den der Datenfeed ueberhaupt sieht.
  # Der Nenner der Volumen-Penalty ist `market_bar.volume x close`, und
  # market_data_sync.py holt Bars mit feed=DataFeed.IEX (der Paper-Key hat kein
  # SIP-Entitlement). Gemessen 15.08.2026: AAPL meldet 1,87 Mio. Stueck gegen
  # real ~50 Mio., META 746k, JPM 237k. Ohne Korrektur schlaegt die Penalty
  # entsprechend zu frueh zu.
  #
  # ACHTUNG, das ist eine SCHAETZUNG, keine Messung: ATLAS hat keine Quelle fuer
  # konsolidiertes Volumen, gegen die sich das kalibrieren liesse (screener_result
  # wurde geprueft und ist dieselbe IEX-Quelle zu anderer Uhrzeit). Herleitung und
  # Vorbehalte in docs/features/F114-volumen-penalty-iex-massstab.md §2.
  # 1.0 = keine Korrektur und exakt das Verhalten vor F114 (= Rollback-Pfad).
  volume_coverage:
    equities: 0.035
    # Krypto bewusst unkorrigiert: Alpacas Krypto-Bars melden das Volumen der
    # eigenen Boerse (BTC/USD am 14.08.2026: rund 1 BTC), der Deckungsgrad ist
    # also unbekannt und sicher nicht 3,5 %. Krypto ist zugleich die einzige
    # Assetklasse, deren Orders der Schwelle nahekommen (BTC 0,61 % gegen 1 %) —
    # ein geratener Faktor wuerde dort eine Live-Kennzahl auf nichts lockern.
    crypto: 1.0

  # Volume-based penalty: additional cost when an order exceeds
  # a fraction of the daily trading volume (simulates market impact).
  penalty:
    # Fraction (as %) of daily volume that triggers the penalty.
    # "> 1 %" threshold from ARCHITECTURE.md §7.8.
    volume_threshold_pct: 1.0

    # Additional basis points per unit of threshold overshoot.
    # penalty_bps = bps_per_x × (order_vol_pct / threshold_pct − 1)
    bps_per_x: 10

    # Absolute cap for the penalty in bps (prevents extreme outliers).
    cap_bps: 50
