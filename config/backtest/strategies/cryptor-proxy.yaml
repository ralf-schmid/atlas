# CRYPTOR als deterministischer Proxy — ARCHITECTURE.md §4.6.
# Trend-Following auf den drei Majors, die auch live im Universum stehen. Bewusst
# ohne Regime-Filter: die BTC-Dominanz liegt zwar in der DB (btc_dominance_snapshot),
# aber erst ab Saisonstart und damit nicht ueber das Backtest-Fenster.

name: cryptor-proxy
description: >-
  SMA-20/50-Trendfolge auf BTC/ETH/SOL, Exit auf Death-Cross, Stop -10 % nach
  Persona-Policy.
persona: CRYPTOR

screen_modelled: [universe]

universe:
  # Deckungsgleich mit config/personas/cryptor.yaml universe_screen
  # (charter_version 3, ADR-0016) — der Proxy bildet den Charter nach, er waehlt
  # sich kein eigenes Universum.
  symbols:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - XRP/USD
    - AVAX/USD
    - AAVE/USD
    - UNI/USD
    - LINK/USD
    - ADA/USD
    - DOT/USD

entry:
  - {signal: sma_crossover, op: eq, value: golden_cross}

exit:
  - {signal: sma_crossover, op: eq, value: death_cross}

not_modelled:
  - "News-Sentiment aus dem gemeinsamen Research-Pool"
  - "BTC-Dominanz als Regime-Filter (Historie reicht nicht zurueck)"
