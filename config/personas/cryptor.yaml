# CRYPTOR — Krypto-Spezialist, ARCHITECTURE.md §4.6
# max_open_positions: ARCHITECTURE.md nennt keine Zahl fuer CRYPTOR ("kleines Universum").
# Auf null gesetzt -> Risk-Gate faellt auf die systemweite Ceiling zurueck (config/risk.yaml).
# Bitte von Ralf gegenpruefen/fixieren, siehe docs/features/F004-risk-gate.md §2.

name: CRYPTOR
# v3 (15.08.2026, ADR-0016): Universum von 3 auf 10 liquide USD-Paare erweitert.
# ARCHITECTURE.md §4.6 sah "BTC, ETH, SOL + wenige weitere" immer schon vor — die
# 3-Symbol-Liste war eine Verengung. Auswahl gemessen, nicht geschaetzt: Alpacas
# eigenes Tagesvolumen ueber 30 Tage, ohne Stablecoins (kein Trend) und ohne
# Meme-Coins (Charter §4.6 verbietet sie ausdruecklich).
charter_version: 3
model: claude-sonnet-5

max_position_pct: 0.20
max_trades_per_day: 8
max_open_positions: null
min_cash_pct: 0.0

stop_loss_policy:
  type: fixed
  max_loss_pct: 0.10

order_types_allowed: [market, stop]

universe_screen:
  # Reihenfolge = gemessenes Alpaca-Tagesvolumen (30 Tage, Stand 15.08.2026).
  # Achtung Slippage: bei 20 % Positionsgroesse auf 5.000 USD (= 1.000 USD/Order)
  # reisst schon BTC die 1-%-Volumenschwelle aus config/review.yaml — jeder
  # Krypto-Trade traegt also die Volumen-Penalty. Das ist kein Fehler, sondern
  # Alpacas duennes Krypto-Buch; siehe ADR-0016 §Konsequenzen.
  universe:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - XRP/USD
    - AVAX/USD
    - AAVE/USD
    - UNI/USD
    - LINK/USD
    - ADA/USD
    - DOT/USD
